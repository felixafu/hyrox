<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HYROX">
<title>HYROX London · Training</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0c0a'/><text y='68' x='50' text-anchor='middle' font-size='52' font-family='monospace' font-weight='bold' fill='%23d7fb43'>H</text></svg>">
<style>
:root{
  --bg:#0b0c0a; --surface:#141613; --surface2:#1c1f1a; --line:#2a2e26;
  --txt:#f0f2eb; --muted:#8b9184; --accent:#d7fb43; --accent-dim:#8fa82c;
  --run:#5eb1ff; --strength:#ff8a5e; --hyrox:#d7fb43; --off:#5a6152; --race:#ff4d6d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* header */
header{
  position:sticky;top:0;z-index:50;background:rgba(11,12,10,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:620px;margin:0 auto}
.brand{font-weight:800;letter-spacing:.14em;font-size:13px;color:var(--accent)}
.brand small{display:block;letter-spacing:.04em;font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}
.cd{text-align:right}
.cd b{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cd span{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}

/* progress bar */
.pbar{height:3px;background:var(--surface2)}
.pbar div{height:100%;background:var(--accent);transition:width .4s ease}

/* tabs */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:rgba(11,12,10,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;justify-content:center;
}
nav .inner{display:flex;width:100%;max-width:620px}
nav button{
  flex:1;background:none;border:0;color:var(--muted);
  padding:11px 4px 13px;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}

section{display:none;padding:20px 0 30px}
section.on{display:block}

.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
h2{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.card.key{border-color:var(--accent-dim);background:linear-gradient(160deg,rgba(215,251,67,.07),var(--surface) 55%)}
.card.race{border-color:var(--race);background:linear-gradient(160deg,rgba(255,77,109,.12),var(--surface) 55%)}
.card.done{opacity:.5}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.tag{
  display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;border:1px solid;margin-bottom:9px;
}
.t-run{color:var(--run);border-color:rgba(94,177,255,.4);background:rgba(94,177,255,.1)}
.t-strength{color:var(--strength);border-color:rgba(255,138,94,.4);background:rgba(255,138,94,.1)}
.t-hyrox{color:var(--hyrox);border-color:rgba(215,251,67,.4);background:rgba(215,251,67,.1)}
.t-off{color:var(--off);border-color:var(--line);background:var(--surface2)}
.t-race{color:var(--race);border-color:rgba(255,77,109,.45);background:rgba(255,77,109,.12)}
.ctitle{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 0 5px;line-height:1.25}
.csub{font-size:14px;color:var(--muted);margin:0}
.flex-pill{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--muted);border:1px dashed var(--line);padding:3px 7px;border-radius:999px;text-transform:uppercase;white-space:nowrap}

/* detail list */
.det{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.det h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 9px;font-weight:700}
.ex{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid rgba(42,46,38,.55);font-size:14.5px}
.ex:last-child{border-bottom:0}
.ex span:last-child{color:var(--accent);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13.5px}
.bullets{margin:0;padding-left:17px;font-size:14.5px;color:#d6dacb}
.bullets li{margin-bottom:6px}
.coach{margin-top:13px;font-size:13.5px;color:var(--muted);border-left:2px solid var(--accent-dim);padding-left:11px;font-style:italic}

/* buttons */
.btn{
  width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface2);color:var(--txt);font-size:14px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit;margin-top:15px;
  transition:.15s;
}
.btn:active{transform:scale(.985)}
.btn.go{background:var(--accent);color:#0b0c0a;border-color:var(--accent)}
.btn.undo{background:transparent;color:var(--muted)}
.btn.sm{padding:11px;font-size:11.5px;margin-top:9px}

textarea{
  width:100%;margin-top:11px;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:11px;font-family:inherit;font-size:14px;resize:vertical;min-height:62px;
}
textarea::placeholder{color:#5a6152}
textarea:focus{outline:none;border-color:var(--accent-dim)}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.strip button{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:9px 2px;cursor:pointer;font-family:inherit;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:.15s;
}
.strip button .d{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.strip button .n{font-size:15px;font-weight:800;color:var(--txt);line-height:1}
.strip button .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.strip button.today{border-color:var(--accent);background:rgba(215,251,67,.09)}
.strip button.today .d{color:var(--accent)}
.strip button.sel{border-color:var(--txt)}
.strip button.fin .dot{background:var(--accent)}
.strip button.isoff .n{color:var(--off)}

.wnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.wnav button{
  background:var(--surface);border:1px solid var(--line);color:var(--txt);
  width:40px;height:40px;border-radius:11px;font-size:19px;cursor:pointer;font-family:inherit;flex:none;
}
.wnav button:disabled{opacity:.28}
.wnav div{text-align:center;flex:1}
.wnav b{display:block;font-size:15px;font-weight:800}
.wnav small{color:var(--muted);font-size:11.5px}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat span{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:7px;font-weight:700}
.stat.hl b{color:var(--accent)}

.phase{margin-bottom:9px}
.phase .pt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.phase .pt span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.track div{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* plan accordion */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden}
.wk>button{
  width:100%;background:none;border:0;color:var(--txt);padding:15px 16px;text-align:left;
  cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.wk .wl b{font-size:15px;font-weight:800;display:block}
.wk .wl small{color:var(--muted);font-size:11.5px}
.wk .wr{text-align:right;flex:none}
.wk .wr b{font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.wk .wr small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.wk .body{display:none;padding:0 16px 15px;border-top:1px solid var(--line)}
.wk.open .body{display:block}
.wk .row{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid rgba(42,46,38,.55);font-size:14px;align-items:baseline}
.wk .row:last-child{border-bottom:0}
.wk .row .dy{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);width:30px;flex:none;text-transform:uppercase;padding-top:2px}
.wk .row .sx{flex:1}
.wk .row .sx b{font-weight:700;display:block;font-size:14.5px}
.wk .row .sx small{color:var(--muted);font-size:12.5px}
.wk .row .ck{color:var(--accent);font-weight:800;flex:none}
.wk.dl{border-color:rgba(94,177,255,.3)}

.note{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13.5px;color:var(--muted);margin-bottom:12px}
.note b{color:var(--txt)}
.rowbtn{display:flex;gap:9px}
.rowbtn .btn{margin-top:9px}
.hide{display:none!important}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="brand">HYROX LONDON<small id="brandSub">Doubles · ExCeL</small></div>
    <div class="cd"><b id="cdN">--</b><span id="cdL">days out</span></div>
  </div>
  <div class="pbar"><div id="pbar" style="width:0%"></div></div>
</header>

<div class="wrap">

  <!-- TODAY -->
  <section id="s-today" class="on">
    <p class="eyebrow" id="todayEyebrow">Today</p>
    <div id="todayBody"></div>
  </section>

  <!-- WEEK -->
  <section id="s-week">
    <div class="wnav">
      <button id="wPrev">‹</button>
      <div><b id="wTitle">Week 1</b><small id="wSub">Rebuild</small></div>
      <button id="wNext">›</button>
    </div>
    <div class="strip" id="strip"></div>
    <div id="weekBody"></div>
  </section>

  <!-- PLAN -->
  <section id="s-plan">
    <p class="eyebrow">Full plan</p>
    <h2 style="margin-bottom:14px">18 weeks to race day</h2>
    <div id="planBody"></div>
  </section>

  <!-- STATS -->
  <section id="s-stats">
    <p class="eyebrow">Progress</p>
    <h2 style="margin-bottom:14px">Where you are</h2>
    <div id="statsBody"></div>
  </section>

</div>

<nav><div class="inner">
  <button data-t="today" class="on"><svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>Today</button>
  <button data-t="week"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Week</button>
  <button data-t="plan"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Plan</button>
  <button data-t="stats"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5 5-3-3-4 4"/></svg>Stats</button>
</div></nav>

<script>
/* ============================================================
   HYROX LONDON 2026 — DOUBLES TRAINING APP
   Race: Wed 2 Dec 2026, ExCeL London
   Plan starts: Mon 3 Aug 2026 (17 weeks + race week)
   ============================================================ */

const START = new Date(2026, 7, 3);   // Mon 3 Aug 2026
const RACE  = new Date(2026, 11, 2);  // Wed 2 Dec 2026
const KEY   = 'hyrox-london-2026';
const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* ---------- strength: progresses in 4 blocks ----------
   1-4 foundation | 5-9 build | 10-14 race-specific | 15-17 sharpen
------------------------------------------------------- */
const BLOCK = wk => wk<=4 ? 'Foundation' : wk<=9 ? 'Build' : wk<=14 ? 'Race-specific' : 'Sharpen';

const push = (wk, dl) => {
  if (dl) return [
    ['Incline DB press','2 x 10, easy'],
    ['Overhead press','2 x 8, easy'],
    ['Lateral raise','2 x 15'],
    ['SkiErg','10min easy, technique only']
  ];
  if (wk <= 4) return [
    ['Flat DB press','3 x 12'],
    ['Overhead press','3 x 10'],
    ['Dip','3 x 8-10, bodyweight'],
    ['Lateral raise','3 x 15'],
    ['SkiErg','4 x 500m easy, technique']
  ];
  if (wk <= 9) return [
    ['Incline DB press','4 x 8-10'],
    ['Overhead press','3 x 6-8'],
    ['Weighted dip','3 x 8-10'],
    ['Lateral raise','3 x 15'],
    ['SkiErg','6 x 500m / 60s rest']
  ];
  if (wk <= 14) return [
    ['Push press','4 x 5'],
    ['Incline DB press','3 x 10'],
    ['Wall balls','3 x 20 unbroken'],
    ['Lateral raise','3 x 15'],
    ['SkiErg','5 x 500m @ race pace / 45s']
  ];
  return [
    ['Push press','3 x 5'],
    ['Incline DB press','3 x 8'],
    ['Wall balls','2 x 15'],
    ['SkiErg','4 x 500m @ race pace']
  ];
};

const pull = (wk, dl) => {
  if (dl) return [
    ['Pull-up','2 easy sets'],
    ['Chest-supported row','2 x 10, easy'],
    ['Face pull','2 x 15'],
    ['Farmers carry','2 x 40m, light']
  ];
  if (wk <= 4) return [
    ['Pull-up','3 sets, stop 2 shy of max'],
    ['Chest-supported row','3 x 12'],
    ['Straight-arm pulldown','3 x 12'],
    ['Face pull','3 x 15'],
    ['Farmers carry','3 x 40m, moderate'],
    ['Plank','3 x 45s']
  ];
  if (wk <= 9) return [
    ['Weighted pull-up','4 x 6'],
    ['Chest-supported row','4 x 10'],
    ['Straight-arm pulldown','3 x 12'],
    ['Face pull','3 x 15'],
    ['Farmers carry','4 x 50m, heavy'],
    ['Hanging leg raise','3 x 12']
  ];
  if (wk <= 14) return [
    ['Weighted pull-up','4 x 5'],
    ['Row erg','4 x 500m / 60s rest'],
    ['Chest-supported row','3 x 10'],
    ['Farmers carry','4 x 60m @ race weight'],
    ['Hanging leg raise','3 x 12']
  ];
  return [
    ['Pull-up','3 x 6'],
    ['Row erg','3 x 500m @ race pace'],
    ['Farmers carry','2 x 50m @ race weight'],
    ['Hanging leg raise','2 x 12']
  ];
};

const lower = (wk, dl) => {
  if (dl) return [
    ['Back squat','3 x 5 @ RPE 6'],
    ['Bulgarian split squat','2 x 10 each leg'],
    ['Romanian deadlift','2 x 8'],
    ['Standing calf raise','2 x 15']
  ];
  if (wk <= 4) {
    const rows = [
      ['Back squat','4 x 6 @ RPE 7'],
      ['Bulgarian split squat','3 x 10 each leg'],
      ['Romanian deadlift','3 x 8']
    ];
    if (wk >= 3) rows.push(['Sled push','6 x 25m, moderate']);
    rows.push(['Standing calf raise','3 x 15']);
    return rows;
  }
  if (wk <= 9) return [
    ['Back squat','4 x 5 @ RPE 8'],
    ['Bulgarian split squat','3 x 10 each leg'],
    ['Romanian deadlift','3 x 8'],
    ['Heavy sled push','8 x 25m'],
    ['Standing calf raise','3 x 15']
  ];
  if (wk <= 14) return [
    ['Back squat','5 x 3, heavy'],
    ['Sandbag walking lunge','3 x 20m'],
    ['Single-leg RDL','2 x 8 each leg'],
    ['Sled push + pull','6 x 12.5m each, race weight'],
    ['Standing calf raise','3 x 15']
  ];
  return [
    ['Back squat','3 x 3, crisp and fast'],
    ['Sandbag walking lunge','2 x 20m'],
    ['Sled push','4 x 12.5m, fast'],
    ['Standing calf raise','2 x 15']
  ];
};

/* ---------- per-week programming ----------
   wed = quality run | sun = key session | sat = easy run | km = weekly volume
------------------------------------------- */
const W = [
 {n:1,ph:'Rebuild',km:18,
  wed:{t:'Easy Z2 + strides',s:'35min Z2, then 6 x 20s strides',b:['Every step conversational. If you cannot talk, slow down.','Strides are relaxed and fast, not sprints. Full recovery between.'],c:'Week 1 exists to prove you can run again without pain. Nothing more.'},
  sat:{t:'Easy Z2 run',s:'30min',b:['Cap by heart rate, not pace. Walk hills if needed.']},
  sun:{t:'Base run + station skill',s:'50min Z2 + 30min technique',b:['50min easy Z2 run','Then unloaded technique: SkiErg, Row, Wall Ball','Film yourself on wall balls and sled push'],c:'Technique bought cheaply in August saves you minutes in December.'}},

 {n:2,ph:'Rebuild',km:20,
  wed:{t:'Easy Z2 + hill strides',s:'40min Z2, then 6 x 20s uphill',b:['Same run as last week, five minutes longer, strides now on a gentle hill.','Uphill strides build push-off strength with less impact. Kind to a healing leg.']},
  sat:{t:'Easy Z2 run',s:'35min'},
  sun:{t:'Base run + station skill',s:'55min Z2 + 30min technique',b:['55min easy Z2','Burpee broad jump technique: low hop, roll straight through, no pause at the top','Sandbag lunge form: 2 x 20m, chest tall, knee kisses the floor','Finish with 20 easy wall balls']}},

 {n:3,ph:'Rebuild',km:24,
  wed:{t:'5K TIME TRIAL',s:'Hard, measured effort',b:['15min easy warm-up plus 4 x 20s strides','5km all-out on a flat route or track','10min easy cool-down','Any hint of the old injury in the last two weeks? Postpone to week 4 and keep everything easy. The TT can wait, a re-injury cannot.'],c:'This sets every pace target for the next 14 weeks. Run it honestly.'},
  sat:{t:'Easy Z2 run',s:'35min'},
  sun:{t:'Base run + station skill',s:'60min Z2 + technique',b:['60min easy Z2','Introduce the sled: push 6 x 25m, pull 4 x 25m, moderate load','Sled pull is the station people never practise. Start now.']}},

 {n:4,ph:'Rebuild',km:20,
  wed:{t:'Z2 + fartlek pickups',s:'45min with 6 x 1min brisk',b:['Inside a 45min easy run: 6 x 1min at a brisk but controlled pace, 2min easy between.','Bridge week. Next Wednesday the intervals start for real.']},
  sat:{t:'Easy Z2 run',s:'35min'},
  sun:{t:'First station circuit',s:'65min total',b:['30min easy Z2 run','Then 3 rounds at easy effort: 500m Ski, 25 wall balls, 50m farmers carry','Focus on smooth transitions, no intensity'],c:'End of Phase 1. If you have had zero pain, you are ready to build.'}},

 {n:5,ph:'Build',km:21,
  wed:{t:'4 x 800m @ 5K pace',s:'90s jog recovery',b:['15min warm-up','4 x 800m at your 5K TT pace','90s easy jog between','10min cool-down'],c:'Your first real taste of the heart rate zone a Hyrox actually lives in.'},
  sat:{t:'Easy Z2 run',s:'40min'},
  sun:{t:'Compromised running',s:'4 rounds: 1km + station',b:['1km @ race pace → 500m SkiErg','1km @ race pace → 4 x 12.5m sled push','1km @ race pace → 500m Row','1km @ race pace → 50 wall balls'],c:'Doubles rep counts. Run straight into the station, no standing around.'}},

 {n:6,ph:'Build',km:22,
  wed:{t:'5 x 800m @ 5K pace',s:'90s jog recovery'},
  sat:{t:'Easy Z2 run',s:'40min'},
  sun:{t:'Compromised running',s:'4 rounds: 1km + station',b:['1km → 4 x 12.5m sled pull','1km → 40m burpee broad jumps','1km → 100m farmers carry','1km → 50m sandbag lunges'],c:'The four stations most people neglect. Deliberately grouped.'}},

 {n:7,ph:'Build',km:24,
  wed:{t:'4 x 1km @ threshold',s:'200m jog recovery',b:['Threshold is comfortably hard: you could speak a short sentence, not a paragraph.']},
  sat:{t:'Easy Z2 run',s:'45min'},
  sun:{t:'Compromised running',s:'5 rounds: 1km + station',b:['1km → 500m Ski','1km → 4 x 12.5m sled push','1km → 500m Row','1km → 100m farmers carry','1km → 50 wall balls']}},

 {n:8,ph:'Build',km:26,
  wed:{t:'3 x 2km @ threshold',s:'400m jog recovery',c:'Biggest threshold session so far. Hold pace on the last rep.'},
  sat:{t:'Easy Z2 run',s:'45min'},
  sun:{t:'Compromised running',s:'5 rounds: 1km + station',b:['1km → 4 x 12.5m sled pull','1km → 40m burpee broad jumps','1km → 50m sandbag lunges','1km → 500m Ski','1km → 50 wall balls']}},

 {n:9,ph:'Build',km:18,dl:1,
  wed:{t:'3 x 1km @ threshold',s:'Deload. 200m jog recovery'},
  sat:{t:'Easy Z2 run',s:'30min'},
  sun:{t:'Deload + technique',s:'45min easy',b:['45min easy Z2','Light sled work, technique only','Review your wall ball and sled footage'],c:'Deload week. Absorb the last four weeks. Resist adding anything.'}},

 {n:10,ph:'Race-specific',km:25,
  wed:{t:'6 x 1km @ race pace',s:'60s standing rest',b:['Race pace = your 5K TT pace + 45-60s/km. Ran the TT at 5:00/km? Target 5:45-6:00/km here.','Should feel controlled, not desperate. Hyrox runs happen on trashed legs, the pace accounts for that.']},
  sat:{t:'Easy Z2 run',s:'45min'},
  sun:{t:'HALF SIMULATION',s:'Runs 1-4 + stations 1-4',b:['1km → 500m SkiErg','1km → 4 x 12.5m sled push','1km → 4 x 12.5m sled pull','1km → 40m burpee broad jumps'],c:'Race intensity, race transitions. From this week every station is at your division’s race weights. Time it and write the splits down.'}},

 {n:11,ph:'Race-specific',km:29,
  wed:{t:'3 x 2km @ threshold',s:'400m jog recovery'},
  sat:{t:'Easy Z2 run',s:'45min'},
  sun:{t:'Race pace + sled block',s:'8 x 1km off 90s, then sled',b:['8 x 1km at target race pace, 90s recovery','Then 10 x 12.5m heavy sled push','Then 10 x 12.5m heavy sled pull'],c:'The longest race-pace block of the plan. This is the fitness test.'}},

 {n:12,ph:'Race-specific',km:26,
  wed:{t:'6 x 1km @ race pace',s:'60s standing rest'},
  sat:{t:'Easy Z2 run',s:'50min'},
  sun:{t:'HALF SIMULATION',s:'Runs 5-8 + stations 5-8',b:['1km → 500m Row','1km → 100m farmers carry','1km → 50m sandbag lunges','1km → 50 wall balls'],c:'The back half is where races are lost. Practise it fatigued.'}},

 {n:13,ph:'Race-specific',km:20,dl:1,
  wed:{t:'4 x 1km @ threshold',s:'Deload. 200m jog recovery'},
  sat:{t:'Easy Z2 run',s:'35min'},
  sun:{t:'Deload + partner drills',s:'45min easy',b:['45min easy Z2','Rehearse handovers and splits with your partner','No intensity, all choreography'],c:'Last deload before the big one. Bank the recovery.'}},

 {n:14,ph:'Race-specific',km:27,
  wed:{t:'5 x 1km @ race pace',s:'60s standing rest'},
  sat:{t:'Easy Z2 run',s:'40min'},
  sun:{t:'FULL DOUBLES SIM',s:'All 8 runs + 8 stations, with partner',b:['Full race, race intensity, with your partner','Run all 8km together, split every station','Record every split'],c:'Your first honest answer to what you will run in December. Pace it like the real thing.'}},

 {n:15,ph:'Sharpen',km:22,
  wed:{t:'6 x 1km @ race pace',s:'60s standing rest'},
  sat:{t:'Easy Z2 run',s:'40min'},
  sun:{t:'DRESS REHEARSAL',s:'6 of 8 rounds, full race logistics',b:['Rounds 1-6 with your partner at race intensity, then stop','Race kit, race shoes, race breakfast, race nutrition, race warm-up','Rehearse handovers and roxzone walking exactly as you will on the day'],c:'The fitness is already banked from week 14. Racing the full distance twice in 8 days just adds fatigue you would carry to 2 Dec. This one is logistics, not fitness.'}},

 {n:16,ph:'Sharpen',km:21,
  wed:{t:'5 x 1km @ race pace',s:'60s standing rest'},
  sat:{t:'Easy Z2 run',s:'35min'},
  sun:{t:'Half sim @ 85%',s:'4 runs + 4 stations, controlled',b:['4 rounds of 1km + station at 85% effort','Sharp but not draining'],c:'Volume down 20%, intensity held. Upper days drop to 3 sets per exercise.'}},

 {n:17,ph:'Taper',km:15,
  wed:{t:'3 x 1km @ race pace',s:'Short and sharp',b:['Feel fast, finish fresh. Stop wanting more.']},
  sat:{t:'Easy Z2 run',s:'25min'},
  sun:{t:'Shakeout',s:'25min + 3 light stations',b:['25min easy Z2','3 stations at half effort, purely to stay sharp'],c:'Three days out. Nothing today can add fitness. Plenty can subtract it.'}}
];

/* ---------- build the full day list ---------- */
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}

const SCHEDULE = [];
W.forEach(w => {
  const days = [
    {ty:'off', t:'Rest day', s:'Full recovery', b:['Optional 20-30min walk or mobility.','Yesterday was your hardest session. This day is doing work.']},
    {ty:'strength', t:'Upper Push', s: (w.dl?'Deload':BLOCK(w.n))+' · push + SkiErg', ex: push(w.n, w.dl), c: w.dl ? 'Deload: easy sets, nothing near failure.' : w.n<=4 ? 'Own the movements before you load them. Log every weight, that is your baseline.' : w.n<=9 ? 'Full intensity. This costs your legs nothing. Add load or reps every week you can.' : w.n<=14 ? 'Strength goes race-shaped: push press drives the sled, wall balls arrive when your shoulders are already tired.' : 'Fewer sets, same speed. Everything crisp, nothing ground out.'},
    Object.assign({ty:'run'}, w.wed),
    {ty:'strength', t:'Lower', s: (w.dl?'Deload':BLOCK(w.n))+' · legs', ex: lower(w.n, w.dl), c: w.dl ? 'Deload: lighter and shorter. The point is arriving at next week fresh.' : w.n<=4 ? 'RPE 7, leave two reps in the tank. Your legs are busy absorbing new run volume.' : w.n<=9 ? 'Heavy and low volume. Built for sled force, not size.' : w.n<=14 ? 'Heavy triples keep strength without soreness. Lunges and sled move to race weight.' : 'Maintenance only. Bar speed over load.'},
    {ty:'strength', t:'Upper Pull', s: (w.dl?'Deload':BLOCK(w.n))+' · pull + core', flex:true, ex: pull(w.n, w.dl), c: w.dl ? 'Deload: 2-3 easy sets. Or skip it entirely, this week is for absorbing.' : 'Flex day. If you skip it, add pull-ups and rows to next Tuesday.'},
    Object.assign({ty:'run'}, w.sat),
    Object.assign({ty:'hyrox', key:true}, w.sun)
  ];
  if (w.n === 17) days[4] = {ty:'off', t:'Rest day', s:'Taper: Friday dropped', b:['Upper pull is cut this week. Rest instead.']};

  days.forEach((s,i) => SCHEDULE.push(Object.assign({
    date: addDays(START, (w.n-1)*7 + i), wk: w.n, di: i, ph: w.ph, km: w.km, dl: !!w.dl
  }, s)));
});

/* race week: Mon 30 Nov, Tue 1 Dec, Wed 2 Dec */
const RW = [
  {ty:'run', t:'Shakeout + strides', s:'20min easy + 4 x 20s', b:['20min very easy','4 x 20s relaxed strides'], c:'Legs remember what fast feels like. That is all this is.'},
  {ty:'off', t:'Full rest', s:'Mobility, kit check, travel', b:['No training','Pack kit, pin number, shoes, nutrition','Early night'], c:'Nervous energy is normal. Do not burn it on a workout.'},
  {ty:'race', t:'RACE DAY', s:'HYROX London · ExCeL', b:['Runs 1-2 deliberately 10-15s/km slower than your week 14 sim pace.','Runs 3-5 settle into sim pace.','Runs 6-8 hold or lift. This is where the sims pay off.','Budget 20-30s per roxzone. Walk with purpose.'], c:'If your first kilometre feels comfortable, you are pacing it correctly.'}
];
RW.forEach((s,i) => SCHEDULE.push(Object.assign({date: addDays(START, 17*7 + i), wk:18, di:i, ph:'Race week', km:0, dl:false}, s)));

const TOTAL_WEEKS = 18;

/* ---------- storage ---------- */
let DB = {done:{}, notes:{}};
try { const r = localStorage.getItem(KEY); if (r) DB = Object.assign(DB, JSON.parse(r)); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} };
const idOf = s => 'w'+s.wk+'d'+s.di;
const isDone = s => !!DB.done[idOf(s)];

/* ---------- helpers ---------- */
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const findToday = () => SCHEDULE.find(s => iso(s.date) === iso(today()));
const TAGS = {run:'Run', strength:'Strength', hyrox:'Hyrox session', off:'Rest', race:'Race'};

function sessionCard(s, opts) {
  opts = opts || {};
  const done = isDone(s), id = idOf(s);
  const cls = ['card', s.key?'key':'', s.ty==='race'?'race':'', done?'done':''].filter(Boolean).join(' ');
  let h = '<div class="'+cls+'" data-id="'+id+'">';
  h += '<div class="ctop"><div>';
  h += '<span class="tag t-'+s.ty+'">'+TAGS[s.ty]+'</span>';
  h += '<p class="ctitle">'+s.t+'</p>';
  if (s.s) h += '<p class="csub">'+s.s+'</p>';
  h += '</div>';
  if (s.flex) h += '<span class="flex-pill">Flex</span>';
  h += '</div>';

  if (s.ex || s.b) {
    h += '<div class="det"><h4>'+(s.ex ? 'The session' : 'How to run it')+'</h4>';
    if (s.ex) s.ex.forEach(e => h += '<div class="ex"><span>'+e[0]+'</span><span>'+e[1]+'</span></div>');
    if (s.b)  h += '<ul class="bullets">' + s.b.map(x => '<li>'+x+'</li>').join('') + '</ul>';
    h += '</div>';
  }
  if (s.c) h += '<div class="coach">'+s.c+'</div>';

  if (opts.actions !== false && s.ty !== 'off') {
    if (s.ty === 'race') {
      h += '<button class="btn go" data-act="tick">'+(done ? 'Raced ✓' : 'Mark as raced')+'</button>';
    } else if (done) {
      h += '<textarea data-act="note" placeholder="How did it go? Splits, loads, how you felt...">'+(DB.notes[id]||'')+'</textarea>';
      h += '<button class="btn undo sm" data-act="tick">Undo</button>';
    } else {
      h += '<button class="btn go" data-act="tick">Mark complete</button>';
    }
  }
  return h + '</div>';
}

/* ---------- render: today ---------- */
function renderToday() {
  const el = document.getElementById('todayBody');
  const s = findToday();
  const t = today();

  if (!s) {
    const before = t < START;
    const wrap = document.createElement('div');
    if (before) {
      const d = Math.ceil((START - t)/864e5);
      wrap.innerHTML = '<div class="card key"><p class="ctitle">Plan starts in '+d+' day'+(d===1?'':'s')+'</p><p class="csub">First session: Monday 3 August 2026</p><div class="coach">Before week 1, get your marathon injury looked at. A 30-minute physio assessment in August is worth more than any session in this plan.</div></div>';
    } else {
      wrap.innerHTML = '<div class="card"><p class="ctitle">Plan complete</p><p class="csub">Race day was 2 December 2026.</p><div class="coach">Hope it went well. Check Stats for the full record.</div></div>';
    }
    el.innerHTML = ''; el.appendChild(wrap);
    document.getElementById('todayEyebrow').textContent = before ? 'Not started' : 'Finished';
    return;
  }

  document.getElementById('todayEyebrow').textContent =
    fmt(s.date) + ' · Week ' + s.wk + ' of ' + TOTAL_WEEKS + ' · ' + s.ph + (s.dl ? ' (deload)' : '');

  let h = sessionCard(s);
  const wkDays = SCHEDULE.filter(x => x.wk === s.wk);
  const dn = wkDays.filter(isDone).length, tot = wkDays.filter(x => x.ty !== 'off').length;
  h += '<div class="note"><b>'+dn+' of '+tot+'</b> sessions done this week' + (s.km ? ' · target volume <b>'+s.km+'km</b>' : '') + '</div>';

  const nxt = SCHEDULE.find(x => x.date > s.date && x.ty !== 'off');
  if (nxt) h += '<div class="note">Next up · <b>'+DAYS[nxt.di]+'</b> ' + nxt.t + '</div>';
  el.innerHTML = h;
}

/* ---------- render: week ---------- */
let curWk = 1, selDi = 0;
function renderWeek() {
  const days = SCHEDULE.filter(s => s.wk === curWk);
  const meta = days[0];
  const td = findToday();

  document.getElementById('wTitle').textContent = 'Week ' + curWk + (curWk === 18 ? ' · Race week' : '');
  document.getElementById('wSub').textContent = meta.ph + (meta.dl ? ' · deload' : '') + (meta.km ? ' · ' + meta.km + 'km' : '');
  document.getElementById('wPrev').disabled = curWk <= 1;
  document.getElementById('wNext').disabled = curWk >= TOTAL_WEEKS;

  document.getElementById('strip').innerHTML = days.map(s => {
    const c = ['strip-b', isDone(s)?'fin':'', s.ty==='off'?'isoff':'',
               (td && iso(td.date)===iso(s.date))?'today':'', s.di===selDi?'sel':''].filter(Boolean).join(' ');
    return '<button class="'+c+'" data-di="'+s.di+'"><span class="d">'+DAYS[s.di]+'</span><span class="n">'+s.date.getDate()+'</span><span class="dot"></span></button>';
  }).join('');

  const sel = days.find(s => s.di === selDi) || days[0];
  document.getElementById('weekBody').innerHTML = sessionCard(sel);
}

/* ---------- render: plan ---------- */
function renderPlan() {
  let h = '';
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const days = SCHEDULE.filter(s => s.wk === w);
    const m = days[0];
    const real = days.filter(s => s.ty !== 'off');
    const dn = real.filter(isDone).length;
    h += '<div class="wk'+(m.dl?' dl':'')+'" data-w="'+w+'"><button data-act="acc">'
      +  '<span class="wl"><b>Week '+w+(w===18?' · Race week':'')+'</b><small>'+fmt(days[0].date)+' – '+fmt(days[days.length-1].date)+' · '+m.ph+(m.dl?' · deload':'')+'</small></span>'
      +  '<span class="wr"><b>'+dn+'/'+real.length+'</b><small>'+(m.km?m.km+'km':'race')+'</small></span></button>'
      +  '<div class="body">'
      +  days.map(s => '<div class="row"><span class="dy">'+DAYS[s.di]+'</span><span class="sx"><b>'+s.t+'</b>'+(s.s?'<small>'+s.s+'</small>':'')+'</span>'+(isDone(s)?'<span class="ck">✓</span>':'')+'</div>').join('')
      +  '</div></div>';
  }
  document.getElementById('planBody').innerHTML = h;
}

/* ---------- render: stats ---------- */
function renderStats() {
  const real = SCHEDULE.filter(s => s.ty !== 'off' && s.ty !== 'race');
  const dn = real.filter(isDone).length;
  const keys = SCHEDULE.filter(s => s.key), keysDone = keys.filter(isDone).length;
  const runs = SCHEDULE.filter(s => s.ty === 'run'), runsDone = runs.filter(isDone).length;
  const str = SCHEDULE.filter(s => s.ty === 'strength'), strDone = str.filter(isDone).length;
  const t = today();
  const daysOut = Math.max(0, Math.ceil((RACE - t)/864e5));

  // streak: consecutive past weeks with every non-rest session done
  let streak = 0;
  for (let w = TOTAL_WEEKS; w >= 1; w--) {
    const d = SCHEDULE.filter(s => s.wk === w && s.ty !== 'off');
    if (!d.length || d[0].date > t) continue;
    if (d.every(isDone)) streak++; else break;
  }

  const elapsed = real.filter(s => s.date <= t);
  const adherence = elapsed.length ? Math.round(elapsed.filter(isDone).length / elapsed.length * 100) : 0;

  let h = '<div class="grid2">'
    + '<div class="stat hl"><b>'+daysOut+'</b><span>Days to race</span></div>'
    + '<div class="stat"><b>'+adherence+'%</b><span>Adherence to date</span></div>'
    + '<div class="stat"><b>'+dn+'</b><span>Sessions done</span></div>'
    + '<div class="stat"><b>'+streak+'</b><span>Perfect weeks</span></div>'
    + '</div>';

  h += '<div class="card"><h4 style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:700">By session type</h4>';
  [['Hyrox key sessions', keysDone, keys.length],
   ['Runs', runsDone, runs.length],
   ['Strength', strDone, str.length]].forEach(r => {
    const pc = r[2] ? Math.round(r[1]/r[2]*100) : 0;
    h += '<div class="phase"><div class="pt"><span>'+r[0]+'</span><span>'+r[1]+' / '+r[2]+'</span></div><div class="track"><div style="width:'+pc+'%"></div></div></div>';
  });
  h += '</div>';

  h += '<div class="card"><h4 style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:700">By phase</h4>';
  ['Rebuild','Build','Race-specific','Sharpen','Taper','Race week'].forEach(p => {
    const d = SCHEDULE.filter(s => s.ph === p && s.ty !== 'off');
    if (!d.length) return;
    const c = d.filter(isDone).length, pc = Math.round(c/d.length*100);
    h += '<div class="phase"><div class="pt"><span>'+p+'</span><span>'+c+' / '+d.length+'</span></div><div class="track"><div style="width:'+pc+'%"></div></div></div>';
  });
  h += '</div>';

  const notes = Object.keys(DB.notes).filter(k => DB.notes[k] && DB.notes[k].trim());
  h += '<div class="note">Your data lives in this browser only. <b>'+notes.length+'</b> session note'+(notes.length===1?'':'s')+' saved. Back it up before clearing your browser.</div>';
  h += '<div class="rowbtn"><button class="btn sm" data-act="export">Export backup</button><button class="btn sm" data-act="import">Restore</button></div>';
  h += '<button class="btn sm undo" data-act="reset">Reset all progress</button>';

  document.getElementById('statsBody').innerHTML = h;
}

/* ---------- header ---------- */
function renderHeader() {
  const t = today();
  const d = Math.ceil((RACE - t)/864e5);
  document.getElementById('cdN').textContent = d > 0 ? d : (d === 0 ? '0' : '—');
  document.getElementById('cdL').textContent = d > 1 ? 'days out' : d === 1 ? 'day out' : d === 0 ? 'RACE DAY' : 'complete';
  const real = SCHEDULE.filter(s => s.ty !== 'off');
  document.getElementById('pbar').style.width = Math.round(real.filter(isDone).length / real.length * 100) + '%';
  const s = findToday();
  document.getElementById('brandSub').textContent = s ? ('Doubles · Week ' + s.wk + '/' + TOTAL_WEEKS) : 'Doubles · ExCeL';
}

function renderAll(){ renderHeader(); renderToday(); renderWeek(); renderPlan(); renderStats(); }

/* ---------- events ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('section').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  document.getElementById('s-' + b.dataset.t).classList.add('on');
  window.scrollTo(0,0);
});

document.getElementById('wPrev').onclick = () => { if (curWk > 1){ curWk--; selDi = 0; renderWeek(); } };
document.getElementById('wNext').onclick = () => { if (curWk < TOTAL_WEEKS){ curWk++; selDi = 0; renderWeek(); } };

document.body.addEventListener('click', e => {
  const strip = e.target.closest('.strip button');
  if (strip) { selDi = +strip.dataset.di; renderWeek(); return; }

  const acc = e.target.closest('[data-act="acc"]');
  if (acc) { acc.parentElement.classList.toggle('open'); return; }

  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;

  if (act === 'tick') {
    const id = btn.closest('.card').dataset.id;
    DB.done[id] = !DB.done[id];
    if (!DB.done[id]) delete DB.done[id];
    save(); renderAll();
    if (navigator.vibrate) navigator.vibrate(12);
    return;
  }
  if (act === 'reset') {
    if (confirm('Delete all ticks and notes? This cannot be undone.')) { DB = {done:{},notes:{}}; save(); renderAll(); }
    return;
  }
  if (act === 'export') {
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'hyrox-progress-' + iso(today()) + '.json';
    a.click();
    return;
  }
  if (act === 'import') {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const d = JSON.parse(rd.result);
          DB = {done: d.done || {}, notes: d.notes || {}};
          save(); renderAll(); alert('Progress restored.');
        } catch(err) { alert('Could not read that file.'); }
      };
      rd.readAsText(f);
    };
    inp.click();
  }
});

document.body.addEventListener('input', e => {
  if (e.target.matches('textarea[data-act="note"]')) {
    DB.notes[e.target.closest('.card').dataset.id] = e.target.value;
    save();
  }
});

/* ---------- boot ---------- */
(function init(){
  const s = findToday();
  if (s) { curWk = s.wk; selDi = s.di; }
  else if (today() > RACE) { curWk = TOTAL_WEEKS; }
  renderAll();
})();
</script>
</body>
</html>
